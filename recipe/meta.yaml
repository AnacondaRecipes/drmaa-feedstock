{% set version = "0.7.9" %}
{% set name = "drmaa" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 12540cd98afc40d5c0b2f38d7b0e46468d1c45192a2f401f41fc2eda9c9f5542

build:
  number: 0
  script: python -m pip install --no-deps --ignore-installed . --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python

test:
  files:
    - run_test.py
  commands:
    - python run_test.py

about:
  home: https://github.com/drmaa-python/drmaa-python
  license: BSD
  license_file: license.txt
  license_family: BSD
  summary: Python wrapper around the C DRMAA library
  description: |
    Distributed Resource Management Application API (DRMAA) bindings for Python.
  doc_url: http://drmaa-python.readthedocs.org
  dev_url: https://github.com/pygridtools/drmaa-python

extra:
  recipe-maintainers:
    - dan-blanchard
    - jakirkham
